[package]
name = "dvfiles"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "A fast Windows 10 style file manager: browse, search, copy, move and recycle"

# the engine (listing, search, copy, recycle) is a library shared by the window and the console tool
[lib]
name = "dvfiles"
path = "src/lib.rs"

[[bin]]
name = "dvfiles"
path = "src/main.rs"

[[bin]]
name = "dvfiles-cli"
path = "src/cli.rs"

[dependencies]
winreg = "0.56.0"
# for the #[implement] macro (the drop target in ui/dnd.rs)
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Variant",
    "Win32_Storage_EnhancedStorage",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3.0.12"

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"
codegen-units = 1
